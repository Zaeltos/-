<div class="auth card">
  <h1>Регистрация</h1>
  <p class="muted">Создайте аккаунт ученика или учителя.</p>

  <form method="post" class="form">
    <label>
      Кто вы?
      <select name="role" required>
        <option value="student" {{student_selected}}>Ученик</option>
        <option value="teacher" {{teacher_selected}}>Учитель</option>
      </select>
    </label>
    <label>
      Имя пользователя
      <input type="text" name="username" minlength="3" maxlength="30"
             value="{{username}}" required>
    </label>
    <label>
      Email
      <input type="email" name="email" value="{{email}}" required>
    </label>
    <label>
      Пароль
      <input type="password" name="password" minlength="6" required>
    </label>
    <label>
      Повторите пароль
      <input type="password" name="password2" minlength="6" required>
    </label>
    <button class="btn btn--full" type="submit">Зарегистрироваться</button>
  </form>

  <p class="muted center">Уже есть аккаунт? <a href="/login">Войти</a></p>
</div>
