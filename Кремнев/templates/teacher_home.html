<h1>Кабинет учителя, {{username}} 👩‍🏫</h1>
<p class="muted">Выберите ученика, чтобы просмотреть или отредактировать его дневник.</p>

<div class="cards">
  <div class="card stat">
    <span class="stat__value">{{students_count}}</span>
    <span class="stat__label">Учеников</span>
  </div>
  <div class="card stat">
    <span class="stat__value">{{schedule_count}}</span>
    <span class="stat__label">Уроков в расписании</span>
  </div>
  <div class="card stat">
    <span class="stat__value">{{grades_count}}</span>
    <span class="stat__label">Оценок</span>
  </div>
</div>

<section class="card">
  <h2>Список учеников</h2>
  {{students_table}}
</section>
