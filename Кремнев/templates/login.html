<div class="auth card">
  <h1>Вход</h1>
  <p class="muted">Введите email и пароль.</p>

  <form method="post" class="form">
    <label>
      Email
      <input type="email" name="email" value="{{email}}" required>
    </label>
    <label>
      Пароль
      <input type="password" name="password" required>
    </label>
    <button class="btn btn--full" type="submit">Войти</button>
  </form>

  <p class="muted center">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
</div>
